name: Build and release mod

on:
  push:
    branches: [ '**' ]
    tags: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    steps:
      - uses: actions/checkout@v7

      - name: Determine versions
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Expected tag format: <minecraft-version>-<mod-version>, e.g. 1.2.5-1.0.16
            if [[ "$GITHUB_REF_NAME" =~ ^([0-9]+(\.[0-9]+)+)-(.+)$ ]]; then
              echo "MC_MAIN_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
              echo "MOD_VERSION=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"
            else
              echo "::error::Tag '$GITHUB_REF_NAME' does not match '<minecraft-version>-<mod-version>'"
              exit 1
            fi
          else
            echo "MOD_VERSION=1.0.${GITHUB_RUN_NUMBER}-SNAPSHOT" >> "$GITHUB_ENV"
          fi

      - name: Set up required JDKs
        uses: actions/setup-java@v5
        with:
          java-version: |
            8
            21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build mod with Gradle
        run: ./gradlew -Pversion=${{ env.MOD_VERSION }} build

      - name: Tag release on GitHub
        if: github.ref_type == 'tag'
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: LICENSE
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          github-tag: ${{ github.ref_name }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: true

      - name: Publish to CurseForge and Modrinth
        if: github.ref_type == 'tag'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: C1EYXRrX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Not yet set up there:
          # curseforge-id: X
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/*-${{ env.MOD_VERSION }}.jar
          name: ${{ github.ref_name }}
          version: ${{ github.ref_name }}
          changelog: |
            Full changelog can be found on [GitHub](https://github.com/ThexXTURBOXx/NilFix/releases)
          loaders: nilloader
          environment: client
          game-versions: |
            1.2.4
            1.2.5
          java: 8
