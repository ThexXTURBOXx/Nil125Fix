name: Build and release mod

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    env:
      MOD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}-SNAPSHOT', github.run_number) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build mod with Gradle
        run: ./gradlew -Pversion=${{ env.MOD_VERSION }} build

      - name: Tag release on GitHub
        if: github.ref_type == 'tag'
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: LICENSE
          name: ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          github-tag: ${{ github.ref_name }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: true

      - name: Publish to CurseForge and Modrinth
        if: github.ref_type == 'tag'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: C1EYXRrX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # Not yet set up there:
          # curseforge-id: X
          # curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/*-${{ env.MOD_VERSION }}.jar
          name: ${{ env.MOD_VERSION }}
          version: ${{ env.MOD_VERSION }}
          changelog: |
            Full changelog can be found on [GitHub](https://github.com/ThexXTURBOXx/Nil125Fix/releases)
          loaders: nilloader
          environment: client
          game-versions: |
            1.2.4
            1.2.5
          java: 8
