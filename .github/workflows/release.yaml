name: Build and release mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build mod with Gradle
        run: ./gradlew -Pversion=1.0.${{ github.run_number }} build

      - uses: ncipollo/release-action@v1
        if: success()
        with:
          tag: 1.0.${{ github.run_number }}
          artifacts: build/libs/Nil125Fix-*.jar
